name: Release

# Publishes a Windows .exe as a GitHub Release whenever a version tag is pushed:
#   git tag v1.0.1
#   git push origin v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller --noconsole --onefile --name "Baseline Lab" main.py

      - name: Smoke test (the exe must start and stay open)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Baseline Lab.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Baseline Lab.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\Baseline Lab.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Baseline Lab.exe" | Out-File -Encoding ascii "dist\SHA256.txt"
          Get-Content "dist\SHA256.txt"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\Baseline Lab.exe" "dist\SHA256.txt" `
            --title "Baseline Lab ${{ github.ref_name }}" `
            --generate-notes
