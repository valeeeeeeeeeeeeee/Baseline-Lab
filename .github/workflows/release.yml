name: Release

# Publishes a Windows .exe as a GitHub Release whenever a version tag is pushed:
#   git tag v1.0.1
#   git push origin v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      # The app compares this with the latest release to tell the user about an update.
      - name: Write the version into the package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $file = "src/baseline_lab/__init__.py"
          $text = Get-Content $file -Raw
          if ($text -notmatch '__version__ = "dev"') { throw "__version__ not found in $file" }
          Set-Content $file ($text -replace '__version__ = "dev"', "__version__ = `"$version`"") -NoNewline

      - name: Run tests
        run: python -m pytest -q

      # The splash screen, shown while the exe loads: a small logo with the name under it, in
      # Consolas, on a white rectangle. Drawn here from the icon because git ignores *.png.
      - name: Draw the splash picture
        shell: python
        run: |
          import os
          from PIL import Image, ImageDraw, ImageFont
          os.makedirs("build", exist_ok=True)
          width, height = 480, 300
          splash = Image.new("RGB", (width, height), "white")
          draw = ImageDraw.Draw(splash)
          draw.rectangle((0, 0, width - 1, height - 1), outline="#c8c8c8")
          logo = Image.open("src/baseline_lab/icon.ico").convert("RGBA")  # its largest size
          logo = logo.resize((112, 112), Image.LANCZOS)
          font = ImageFont.truetype("consola.ttf", 30)
          gap = 18
          top = (height - logo.height - gap - font.getbbox("baseline lab.")[3]) // 2
          splash.paste(logo, ((width - logo.width) // 2, top), logo)
          draw.text((width // 2, top + logo.height + gap), "baseline lab.", font=font,
                    fill="black", anchor="mt")
          splash.save("build/splash.png")

      # The excluded modules are not used by the app and only make the exe bigger. Do not add
      # _pyrepl (scipy imports pydoc, which needs it), mpl_toolkits (matplotlib warns without it)
      # or ssl / _ssl (the update check reads GitHub over HTTPS).
      - name: Build executable
        run: >
          pyinstaller --noconsole --onedir --name "Baseline Lab"
          --icon src/baseline_lab/icon.ico
          --add-data "src/baseline_lab/icon.ico;baseline_lab"
          --splash build/splash.png
          --exclude-module PIL._avif --exclude-module PIL._webp
          --exclude-module _hashlib
          --exclude-module pygments --exclude-module setuptools --exclude-module pkg_resources
          --exclude-module pytest --exclude-module _pytest --exclude-module jinja2
          --exclude-module pydoc_data --exclude-module yaml --exclude-module IPython
          src/main.py

      - name: Smoke test (the exe must start and stay open)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Baseline Lab\Baseline Lab.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Baseline Lab.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      # A one-dir build is a folder (the exe and its _internal), so the release carries it zipped.
      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path "dist\Baseline Lab" -DestinationPath "dist\Baseline Lab.zip"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\Baseline Lab.zip" `
            --title "Baseline Lab ${{ github.ref_name }}" `
            --generate-notes
